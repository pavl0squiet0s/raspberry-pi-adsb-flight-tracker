server.modules = ( "mod_alias", "mod_setenv", "mod_cgi" )
server.document-root = "/usr/share/flight-tracker/web"
server.bind = "0.0.0.0"
server.port = 8080
server.username = "lighttpd"
server.groupname = "lighttpd"
server.pid-file = "/run/lighttpd/flight-tracker.pid"
server.errorlog = "/var/log/flight-tracker/lighttpd.log"
server.follow-symlink = "enable"
index-file.names = ( "index.html" )

mimetype.assign = (
  ".html" => "text/html; charset=utf-8",
  ".css" => "text/css; charset=utf-8",
  ".js" => "application/javascript; charset=utf-8",
  ".json" => "application/json",
  ".png" => "image/png",
  ".webp" => "image/webp",
  ".svg" => "image/svg+xml",
  ".pbf" => "application/x-protobuf",
  ".pmtiles" => "application/vnd.pmtiles",
  "" => "application/octet-stream"
)

alias.url = (
  "/api/" => "/usr/libexec/flight-tracker/",
  "/data/" => "/run/flight-tracker/",
  "/diagnostics/data/" => "/run/flight-tracker/",
  "/diagnostics/" => "/usr/share/dump1090/html/"
)

cgi.assign = ( ".py" => "/usr/bin/python3" )

$HTTP["url"] =~ "^/data/" {
  setenv.add-response-header = ( "Cache-Control" => "no-store" )
}

$HTTP["url"] =~ "^/maps/" {
  setenv.add-response-header = ( "Cache-Control" => "public, max-age=86400" )
}
